# CCJ Backend Database Configuration
# This file contains database connection settings

development:
  host: localhost
  port: 5432
  database: ccj_db
  username: postgres
  password: postgres
  pool:
    max: 20
    min: 5
    idleTimeoutMillis: 30000
    connectionTimeoutMillis: 2000

production:
  host: ${DB_HOST}
  port: ${DB_PORT}
  database: ${DB_NAME}
  username: ${DB_USER}
  password: ${DB_PASSWORD}
  pool:
    max: 50
    min: 10
    idleTimeoutMillis: 30000
    connectionTimeoutMillis: 5000

test:
  host: localhost
  port: 5432
  database: ccj_db_test
  username: postgres
  password: postgres
  pool:
    max: 10
    min: 2
    idleTimeoutMillis: 30000
    connectionTimeoutMillis: 2000

# Docker Compose Configuration
docker:
  host: postgres
  port: 5432
  database: ccj_db
  username: postgres
  password: postgres
  pool:
    max: 20
    min: 5
    idleTimeoutMillis: 30000
    connectionTimeoutMillis: 2000


